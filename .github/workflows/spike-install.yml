name: Spike — omp install

# Temporary Phase-1 proof: omp installs and runs headless on a GitHub runner.
# Removed after E2E validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install omp
        run: ./scripts/install-omp.sh

      - name: Headless call
        env:
          OMP_API_KEY: ${{ secrets.OMP_API_KEY }}
          OMP_PROVIDER: ${{ vars.OMP_PROVIDER || 'zhipu-coding-plan' }}
          OMP_MAX_MINUTES: '2'
        run: |
          echo 'Reply with exactly: PONG' > mini.md
          ./scripts/run-omp.sh mini.md out.md
          cat out.md
          grep -q PONG out.md
