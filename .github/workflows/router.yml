name: OMP Router

# Dogfood + E2E harness: routes labeled issues/PRs of THIS repo to the
# reusable flows. Caller repos copy this file.
#
# NOTE: the permissions block is the CEILING for called workflows — a reusable
# workflow cannot request more than its caller grants. Each called flow
# narrows its own token further.
on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  issue-flows:
    if: >-
      github.event_name == 'issues' &&
      contains(fromJSON('["auto-plan", "bug-triage"]'), github.event.label.name)
    uses: ./.github/workflows/omp-issue-flow.yml
    with:
      task: ${{ github.event.label.name }}
      issue-number: ${{ fromJSON(github.event.issue.number) }}
    secrets: inherit

  implement:
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'auto-implement'
    uses: ./.github/workflows/omp-auto-implement.yml
    with:
      issue-number: ${{ fromJSON(github.event.issue.number) }}
    secrets: inherit

  review:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.label.name == 'auto-review'
    uses: ./.github/workflows/omp-code-review.yml
    with:
      pr-number: ${{ fromJSON(github.event.pull_request.number) }}
    secrets: inherit
