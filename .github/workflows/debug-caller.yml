name: Debug Caller

on:
  workflow_dispatch:
    inputs:
      issue-number:
        required: true
        type: number
      task:
        required: true
        type: string

permissions:
  contents: read
  issues: write
jobs:
  call:
    uses: ./.github/workflows/omp-issue-flow.yml
    with:
      task: ${{ inputs.task }}
      issue-number: ${{ fromJSON(inputs.issue-number) }}
    secrets: inherit
